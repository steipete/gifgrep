name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Format
        run: test -z "$(gofumpt -l .)"

      - name: Lint
        run: golangci-lint run

      - name: Test
        run: go test -race ./... -cover

      - name: CLI smoke
        run: |
          go build -o "$RUNNER_TEMP/gifgrep" ./cmd/gifgrep
          "$RUNNER_TEMP/gifgrep" --help
          "$RUNNER_TEMP/gifgrep" still gifdecode/testdata/animexample2.gif --at 0 -o "$RUNNER_TEMP/still.png"
          "$RUNNER_TEMP/gifgrep" sheet gifdecode/testdata/animexample2.gif --frames 3 -o "$RUNNER_TEMP/sheet.png"

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.26.8
          - os: macos-latest
            go: 1.27.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - name: CLI smoke
        run: |
          go build -o "$RUNNER_TEMP/gifgrep" ./cmd/gifgrep
          "$RUNNER_TEMP/gifgrep" --version
          "$RUNNER_TEMP/gifgrep" still gifdecode/testdata/animexample2.gif --at 0 -o "$RUNNER_TEMP/still.png"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs-site
      - name: Check generated documentation
        run: git diff --exit-code -- docs

  release-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check release metadata
        run: |
          ./scripts/check-release-metadata
          python3 scripts/test-release-checks.py
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish --parallelism=2
      - name: Check packaged CLI
        run: |
          mkdir "$RUNNER_TEMP/release-smoke"
          tar -xzf dist/gifgrep_*_darwin_arm64.tar.gz -C "$RUNNER_TEMP/release-smoke"
          ./scripts/check-macos-target "$RUNNER_TEMP/release-smoke/gifgrep" darwin
          "$RUNNER_TEMP/release-smoke/gifgrep" --version
