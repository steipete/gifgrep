name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release (for example, 0.4.3)
        required: true
        type: string

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/check-release-metadata "$RELEASE_VERSION"

  release:
    needs: preflight
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@d22bcb545b8e43b51fb332be6bcd97b5e7d40234 # v1.10.0
    with:
      version: ${{ inputs.version }}
      repository-type: personal
      homebrew-tap: steipete/homebrew-tap
      homebrew-formula: gifgrep
      archive-files: '["README.md", "LICENSE"]'
      checksum-filename: SHA256SUMS
      build-runner: macos
      darwin-universal: disabled
      nfpm: disabled
      strict-checks: true
      ci-check-events: '["push", "pull_request"]'
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
